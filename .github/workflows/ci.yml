name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec + UseCase health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: findu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/findu_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Prepare database
        run: bundle exec rails db:test:prepare

      - name: Run RSpec
        run: |
          mkdir -p tmp
          bundle exec rspec \
            --format documentation \
            --format json \
            --out tmp/rspec.json

      - name: UseCase health report
        if: always()
        run: ruby script/use_case_health_report.rb

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usecase-health
          path: |
            tmp/rspec.json
            tmp/use_case_health.md
          if-no-files-found: warn
