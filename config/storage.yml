test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2.
# Required env: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
cloudflare:
  service: S3
  endpoint: https://<%= ENV.fetch("R2_ACCOUNT_ID", "") %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["R2_BUCKET"] %>
  force_path_style: true

# Supabase Storage (S3-compatible).
# Required env: SUPABASE_PROJECT_REF, SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY, SUPABASE_S3_REGION, SUPABASE_BUCKET
supabase:
  service: S3
  endpoint: https://<%= ENV.fetch("SUPABASE_PROJECT_REF", "") %>.supabase.co/storage/v1/s3
  access_key_id: <%= ENV["SUPABASE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SUPABASE_S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("SUPABASE_S3_REGION", "us-east-1") %>
  bucket: <%= ENV["SUPABASE_BUCKET"] %>
  force_path_style: true

